{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="gota-avatar-page">

  <header class="gota-avatar-header">

    <div class="gota-avatar-header__icon">
      <i class="fas fa-user-circle" aria-hidden="true"></i>
    </div>

    <div>
      <span class="gota-avatar-header__kicker">
        Tu perfil en Gota
      </span>

      <h1 class="gota-avatar-header__title">
        Cambiar avatar
      </h1>

      <p class="gota-avatar-header__description">
        Elegí la imagen que querés mostrar en tu perfil.
      </p>
    </div>

  </header>

  {% if user.avatar %}
    <section class="gota-avatar-current">

      <span class="gota-avatar-current__label">
        Avatar actual
      </span>

      <img
        src="{{ user.avatar.url }}"
        alt="Avatar actual de {{ user.username }}"
        class="gota-avatar-current__image"
        loading="lazy"
      >

    </section>
  {% endif %}

  <section class="gota-avatar-card">

    <form
      method="post"
      enctype="multipart/form-data"
      class="gota-avatar-form"
    >
      {% csrf_token %}

      <div class="gota-avatar-form__fields">
        {{ form.as_p }}
      </div>

      <button
        type="submit"
        class="gota-avatar-form__submit"
      >
        <i class="fas fa-check" aria-hidden="true"></i>
        <span>Guardar cambios</span>
      </button>

    </form>

  </section>

</div>

{% endblock %}
