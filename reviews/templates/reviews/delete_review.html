{% extends "base.html" %}
{% load static %}

{% block content %}

<div class="gota-danger-page">

  <div class="gota-danger-card">

    <!-- ICONO -->
    <div class="gota-danger-card__icon">
      <i
        class="far fa-trash-alt"
        aria-hidden="true"
      ></i>
    </div>


    <!-- CONTENIDO -->
    <span class="gota-danger-card__kicker">
      Eliminar reseña
    </span>

    <h1 class="gota-danger-card__title">
      ¿Querés eliminar esta reseña?
    </h1>

    <p class="gota-danger-card__description">
      Estás por eliminar tu reseña de
      <strong>{{ cafe.name }}</strong>.
      Esta acción no se puede deshacer.
    </p>


    <!-- ACCIONES -->
    <form
      method="post"
      class="gota-danger-card__actions"
    >
      {% csrf_token %}

      <button
        type="submit"
        class="gota-danger-card__delete"
      >
        <i
          class="far fa-trash-alt"
          aria-hidden="true"
        ></i>

        <span>Eliminar reseña</span>
      </button>


      <a
        href="{% url 'reviews:cafe_detail' cafe.id %}"
        class="gota-danger-card__cancel"
      >
        Cancelar
      </a>

    </form>

  </div>

</div>

{% endblock %}
