{% load static %}

<div class="gota-map-page">

  <header class="gota-map-header">

    <div class="gota-map-header__icon">
      <i class="fas fa-map-marked-alt" aria-hidden="true"></i>
    </div>

    <div class="gota-map-header__content">

      <span class="gota-map-header__kicker">
        Explorá por ubicación
      </span>

      <h1 class="gota-map-header__title">
        Cafés en el mapa
      </h1>

      <p class="gota-map-header__description">
        Buscá una zona, usá tu ubicación o explorá cafeterías directamente en el mapa.
      </p>

    </div>

  </header>

  <!-- CONTROLES -->
<section class="gota-map-controls">

  <form
    id="form-direccion"
    class="gota-map-search"
  >

    <div class="gota-map-search__field">
      <i class="fas fa-search" aria-hidden="true"></i>

      <input
        type="text"
        id="direccion"
        name="direccion"
        placeholder="Buscar cafés cerca de una dirección"
        required
      >
    </div>

    <button
      type="submit"
      class="gota-map-search__submit"
    >
      Buscar
    </button>

  </form>

  <div
    id="error-direccion"
    class="gota-map-search__error hidden"
  >
    <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
    <span>Dirección no encontrada</span>
  </div>

  <div class="gota-map-actions">

    <button
      id="btn-cerca-mio"
      type="button"
      class="gota-map-action gota-map-action--primary"
    >
      <i class="fas fa-location-arrow" aria-hidden="true"></i>
      <span>Cafés cerca mío</span>
      <small>3 km</small>
    </button>

    <button
      id="btn-todos"
      type="button"
      class="gota-map-action gota-map-action--secondary"
    >
      <i class="fas fa-globe-americas" aria-hidden="true"></i>
      <span>Ver todos</span>
    </button>

  </div>

</section>

  <!-- FILTROS -->
  <section class="gota-map-filters">

    <div class="gota-map-filters__header">
      <div>
        <span class="gota-map-filters__kicker">
          Afiná la búsqueda
        </span>

        <h2 class="gota-map-filters__title">
          Filtros
        </h2>
      </div>
    </div>

    <div class="gota-map-filters__list">

      <label class="gota-map-filter">
        <input type="checkbox" class="filtro-mapa" value="is_pet_friendly">
        <i class="fas fa-paw" aria-hidden="true"></i>
        <span>Pet friendly</span>
      </label>

      <label class="gota-map-filter">
        <input type="checkbox" class="filtro-mapa" value="has_wifi">
        <i class="fas fa-wifi" aria-hidden="true"></i>
        <span>Wi-Fi</span>
      </label>

      <label class="gota-map-filter">
        <input type="checkbox" class="filtro-mapa" value="has_outdoor_seating">
        <i class="fas fa-chair" aria-hidden="true"></i>
        <span>Mesas afuera</span>
      </label>

      <label class="gota-map-filter">
        <input type="checkbox" class="filtro-mapa" value="is_vegan_friendly">
        <i class="fas fa-leaf" aria-hidden="true"></i>
        <span>Vegano</span>
      </label>

      <label class="gota-map-filter">
        <input type="checkbox" class="filtro-mapa" value="has_parking">
        <i class="fas fa-parking" aria-hidden="true"></i>
        <span>Estacionamiento</span>
      </label>

      <label class="gota-map-filter">
        <input type="checkbox" class="filtro-mapa" value="is_accessible">
        <i class="fas fa-wheelchair" aria-hidden="true"></i>
        <span>Accesible</span>
      </label>

      <label class="gota-map-filter">
        <input type="checkbox" class="filtro-mapa" value="has_vegetarian_options">
        <i class="fas fa-seedling" aria-hidden="true"></i>
        <span>Opción vegetariana</span>
      </label>

      <label class="gota-map-filter">
        <input type="checkbox" class="filtro-mapa" value="serves_breakfast">
        <i class="fas fa-sun" aria-hidden="true"></i>
        <span>Desayuno</span>
      </label>

      <label class="gota-map-filter">
        <input type="checkbox" class="filtro-mapa" value="serves_alcohol">
        <i class="fas fa-glass-martini-alt" aria-hidden="true"></i>
        <span>Alcohol</span>
      </label>

      <label class="gota-map-filter">
        <input type="checkbox" class="filtro-mapa" value="has_books_or_games">
        <i class="fas fa-book-open" aria-hidden="true"></i>
        <span>Juegos o libros</span>
      </label>

      <label class="gota-map-filter">
        <input type="checkbox" class="filtro-mapa" value="has_air_conditioning">
        <i class="fas fa-snowflake" aria-hidden="true"></i>
        <span>Aire acondicionado</span>
      </label>

      <label class="gota-map-filter">
        <input type="checkbox" class="filtro-mapa" value="has_gluten_free">
        <i class="fas fa-wheat-awn-circle-exclamation" aria-hidden="true"></i>
        <span>Sin TACC</span>
      </label>

      <label class="gota-map-filter">
        <input type="checkbox" class="filtro-mapa" value="has_specialty_coffee">
        <img
          src="{% static 'images/gota-icon.png' %}"
          alt=""
          aria-hidden="true"
        >
        <span>Café de especialidad</span>
      </label>

      <label class="gota-map-filter">
        <input type="checkbox" class="filtro-mapa" value="has_artisanal_pastries">
        <i class="fas fa-cookie-bite" aria-hidden="true"></i>
        <span>Pastelería artesanal</span>
      </label>

    </div>

  </section>

  <!-- RESULTADOS + MAPA -->
  <section class="gota-map-explorer">

    <div class="gota-map-results-panel">

      <div class="gota-map-results-panel__header">
        <div>
          <span class="gota-map-results-panel__kicker">
            Resultados
          </span>

          <h2 class="gota-map-results-panel__title">
            Cafeterías encontradas
          </h2>
        </div>
      </div>

      <div
        id="lista-cafes"
        class="gota-map-results-panel__list"
      ></div>

    </div>

    <div class="gota-map-canvas">

      <div
        id="map"
        class="gota-map-canvas__map"
      ></div>

    </div>

  </section>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const cafes = JSON.parse('{{ cafes_json|escapejs }}');
    const map = L.map('map').setView([-34.6037, -58.3816], 12);
    let markers = [];
    let circle = null;

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      referrerPolicy: 'origin'
    }).addTo(map);

    function agregarMarcadores(lista) {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      const filtrados = aplicarFiltros(lista);
      const listaDIV = document.getElementById("lista-cafes");
      listaDIV.innerHTML = '';

      filtrados.forEach(cafe => {
        if (cafe.latitude != null && cafe.longitude != null) {
          const popup = `
            <div class="gota-map-popup">

              <div class="gota-map-popup__heading">
                <img
                  src="{% static 'images/gota-icon.png' %}"
                  alt=""
                  aria-hidden="true"
                >

                <strong>
                  ${cafe.name}
                </strong>
              </div>

              ${cafe.address ? `
                <p class="gota-map-popup__address">
                  <i class="fas fa-map-marker-alt" aria-hidden="true"></i>
                  <span>${cafe.address}</span>
                </p>
              ` : ''}

              <a
                href="${cafe.url}"
                class="gota-map-popup__cta"
              >
                <span>Ver cafetería</span>
                <i class="fas fa-arrow-right" aria-hidden="true"></i>
              </a>

            </div>`;
          const gotaMapIcon = L.icon({
            iconUrl: "{% static 'images/gota-icon.png' %}",
            iconSize: [32, 32],
            iconAnchor: [16, 32],
            popupAnchor: [0, -28],
            className: "gota-map-marker"
          });

          const marker = L.marker(
            [cafe.latitude, cafe.longitude],
            { icon: gotaMapIcon }
          )
            .bindPopup(popup)
            .addTo(map);

          markers.push(marker);

          const card = `
            <article class="gota-map-result-card">

              <div class="gota-map-result-card__content">

                <div class="gota-map-result-card__heading">

                  <div>
                    <h3 class="gota-map-result-card__title">
                      ${cafe.name}
                    </h3>

                    ${cafe.address ? `
                      <p class="gota-map-result-card__address">
                        <i class="fas fa-map-marker-alt" aria-hidden="true"></i>
                        <span>${cafe.address}</span>
                      </p>
                    ` : ''}

                  </div>

                  <img
                    src="{% static 'images/gota-icon.png' %}"
                    alt=""
                    aria-hidden="true"
                    class="gota-map-result-card__icon"
                  >

                </div>

                <a
                  href="${cafe.url}"
                  class="gota-map-result-card__cta"
                >
                  <span>Ver cafetería</span>
                  <i class="fas fa-arrow-right" aria-hidden="true"></i>
                </a>

              </div>

            </article>`;
          listaDIV.insertAdjacentHTML('beforeend', card);
        }
      });
    }

    function calcularDistancia(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) ** 2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function filtrarCafesCercanos(lat, lon) {
      if (circle) map.removeLayer(circle);
      circle = L.circle([lat, lon], {
        radius: 3000,
        color: "#172C6D",
        weight: 2,
        opacity: 0.8,
        fillColor: "#BFDBFE",
        fillOpacity: 0.22
      }).addTo(map);

      const cercanos = cafes.filter(c => {
        if (c.latitude == null || c.longitude == null) return false;
        return calcularDistancia(lat, lon, c.latitude, c.longitude) <= 3;
      });

      map.setView([lat, lon], 14);
      agregarMarcadores(cercanos);
    }

    document.getElementById("btn-cerca-mio")?.addEventListener("click", () => {
      if (!navigator.geolocation) return alert("Tu navegador no soporta geolocalización.");
      navigator.geolocation.getCurrentPosition(
        pos => filtrarCafesCercanos(pos.coords.latitude, pos.coords.longitude),
        ()  => alert("No se pudo obtener tu ubicación.")
      );
    });

    document.getElementById("form-direccion")?.addEventListener("submit", function(e) {
      e.preventDefault();
      const direccion = document.getElementById("direccion").value;
      const error = document.getElementById("error-direccion");
      error.classList.add("hidden");

      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(direccion)}`;
      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (Array.isArray(data) && data.length > 0) {
            const lat = parseFloat(data[0].lat);
            const lon = parseFloat(data[0].lon);
            filtrarCafesCercanos(lat, lon);
          } else {
            error.classList.remove("hidden");
          }
        })
        .catch(() => error.classList.remove("hidden"));
    });

    window.verTodosLosCafes = function () {
      if (circle) { map.removeLayer(circle); circle = null; }
      map.setView([-34.6037, -58.3816], 12);
      agregarMarcadores(cafes);
    };
    document.getElementById('btn-todos')?.addEventListener('click', (e) => {
      e.preventDefault();
      window.verTodosLosCafes();
    });

    function cumpleFiltros(cafe) {
      const filtrosActivos = Array.from(document.querySelectorAll(".filtro-mapa:checked"))
                                  .map(el => el.value);
      return filtrosActivos.every(f => !!cafe[f]);
    }

    function aplicarFiltros(lista) {
      return lista.filter(c => cumpleFiltros(c));
    }

    document.querySelectorAll(".filtro-mapa").forEach(cb => {
      cb.addEventListener("change", () => agregarMarcadores(cafes));
    });

    agregarMarcadores(cafes);
  });
</script>
