{% extends "base.html" %}
{% load static %}

{% block content %}

<div class="gota-auth-page">

  <div class="gota-auth-card">

    <!-- HEADER -->
    <header class="gota-auth-header">

      <div class="gota-auth-header__icon">
        <img
          src="{% static 'images/gota-icon.png' %}"
          alt=""
          aria-hidden="true"
        >
      </div>

      <span class="gota-auth-header__kicker">
        Tu cuenta
      </span>

      <h1 class="gota-auth-header__title">
        ¿Querés cerrar sesión?
      </h1>

      <p class="gota-auth-header__description">
        Podés volver a iniciar sesión cuando quieras.
      </p>

    </header>


    <!-- CERRAR SESIÓN -->
    <form
      action="{% url 'account_logout' %}"
      method="POST"
      class="gota-auth-form"
    >
      {% csrf_token %}

      <button
        type="submit"
        class="gota-auth-submit"
      >
        <span>Cerrar sesión</span>

        <i
          class="fas fa-sign-out-alt"
          aria-hidden="true"
        ></i>
      </button>

    </form>


    <!-- CANCELAR -->
    <div class="gota-auth-footer">

      <a href="/">

        <i
          class="fas fa-arrow-left"
          aria-hidden="true"
        ></i>

        Volver al inicio

      </a>

    </div>

  </div>

</div>

{% endblock %}
