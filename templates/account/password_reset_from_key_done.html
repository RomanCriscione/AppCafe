{% extends "base.html" %}

{% block content %}
<div style="
  max-width: 520px;
  margin: 48px auto;
  padding: 0 20px;
">
  <div style="
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 24px;
    padding: 32px 28px;
    box-shadow: 0 10px 30px rgba(17, 24, 39, 0.06);
    text-align: center;
  ">
    <div style="
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #ecfdf5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    ">
      ✓
    </div>

    <h1 style="
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      color: #111827;
    ">
      Contraseña actualizada
    </h1>

    <p style="
      margin: 12px 0 0;
      color: #6b7280;
      font-size: 15px;
      line-height: 1.5;
    ">
      Tu contraseña fue actualizada correctamente.
      Ya podés volver a iniciar sesión en Gota.
    </p>

    <a
      href="{% url 'account_login' %}"
      style="
        display: block;
        margin-top: 24px;
        background: #1e3a8a;
        color: #ffffff;
        text-decoration: none;
        padding: 14px 18px;
        border-radius: 14px;
        font-weight: 700;
      "
    >
      Iniciar sesión
    </a>

    <a
      href="/"
      style="
        display: inline-block;
        margin-top: 16px;
        color: #1e3a8a;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
      "
    >
      Volver a Gota
    </a>
  </div>
</div>
{% endblock %}
